<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera - 15 Anos Ana Julia</title>
    
    <meta property="og:title" content="Câmera Exclusiva 📸">
    <meta property="og:description" content="Registre os momentos na sua perspectiva!">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --azul-escuro: #0a1128;
            --azul-fundo: #040814;
            --prata: #e0e0e0;
            --prata-escuro: #888888;
            --rosa: #f4acb7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--azul-fundo); font-family: 'Montserrat', sans-serif;
            color: var(--prata); display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(circle at top, #0a1128 0%, #040814 100%);
        }

        h1, h2 { font-family: 'Great Vibes', cursive; color: var(--rosa); text-align: center; font-weight: normal;}
        
        .screen { display: none; width: 100%; height: 100dvh; position: absolute; top: 0; left: 0; overflow-y: auto; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #camera-screen.active, #gallery-screen.active { 
            height: calc(100dvh - 75px); 
            justify-content: flex-start;
            position: relative;
        }
        #camera-screen.active { justify-content: center; overflow: hidden; }

        /* === TELA ADMIN === */
        .admin-box {
            background: rgba(10, 17, 40, 0.95); border: 1px solid var(--rosa);
            padding: 30px 20px; border-radius: 24px; text-align: center; width: 90%; max-width: 380px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            margin: auto; max-height: 90vh; overflow-y: auto;
        }
        .admin-box h2 { font-size: 3rem; margin-bottom: 5px; }
        .admin-box p { font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; color: var(--prata-escuro);}
        
        .date-input {
            width: 100%; padding: 14px; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid rgba(224, 224, 224, 0.2); background: rgba(0,0,0,0.5); color: #fff;
            font-family: 'Montserrat', sans-serif; outline: none; text-align: center; font-size: 0.95rem;
        }
        .date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        #link-gerado-container { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .link-text { font-size: 0.75rem; background: #000; padding: 10px; border-radius: 8px; word-break: break-all; color: var(--rosa); margin-bottom: 12px; border: 1px dashed rgba(244, 172, 183, 0.3);}

        /* === TELA LOGIN === */
        .login-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(224, 224, 224, 0.15);
            padding: 40px 25px; border-radius: 24px; backdrop-filter: blur(15px);
            text-align: center; width: 90%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .login-title { font-size: 3.5rem; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(244, 172, 183, 0.3); }
        .login-subtitle { font-size: 0.85rem; color: var(--prata-escuro); margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; text-transform: uppercase;}
        
        .lux-input {
            width: 100%; padding: 16px; border-radius: 12px; margin-bottom: 25px;
            border: 1px solid rgba(224, 224, 224, 0.2); background: rgba(0,0,0,0.4);
            color: #fff; font-size: 0.95rem; text-align: center; outline: none; transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        .lux-input:focus { border-color: var(--rosa); box-shadow: 0 0 15px rgba(244, 172, 183, 0.2); }

        .btn-acao {
            background: linear-gradient(135deg, var(--prata) 0%, #999 100%); color: var(--azul-fundo);
            border: none; padding: 15px 30px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1); transition: all 0.3s ease;
        }
        .btn-acao:active { transform: scale(0.97); }
        .btn-rosa { background: var(--rosa); color: #000; }

        /* === TELA CÂMERA === */
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        .capture-wrapper { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .capture-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.2); border: 3px solid #fff;
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s ease;
        }
        .capture-btn:active { background: #fff; transform: scale(0.9); }
        
        .status-toast {
            position: absolute; top: 20px; background: rgba(4, 8, 20, 0.85); padding: 12px 25px; border-radius: 30px; border: 1px solid var(--rosa);
            font-size: 0.85rem; display: none; z-index: 20; color: #fff; font-weight: 500; backdrop-filter: blur(10px); letter-spacing: 1px; text-transform: uppercase; text-align: center;
        }

        /* === TELA GALERIA === */
        #gallery-screen { padding: 25px 15px; }
        .gallery-header { margin-bottom: 20px; text-align: center; width: 100%; }
        .timer-revelacao { font-size: 0.8rem; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--rosa); display: inline-block; margin-top: 8px; letter-spacing: 0.5px;}
        
        .grid-galeria { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; padding-bottom: 40px; }
        .foto-card {
            position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; 
            background: #111; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .foto-card img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.5s ease; }
        
        .foto-card.bloqueada img { filter: blur(15px) grayscale(30%); }
        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); z-index: 2;
        }
        .lock-icon { font-size: 2rem; margin-bottom: 5px; }
        .foto-autor { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 3px #000;}

        /* Botões Luxuosos Estilizados */
        .foto-actions {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 8px; 
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; justify-content: space-around; gap: 6px;
        }
        .btn-lux {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; 
            padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px;
            cursor: pointer; backdrop-filter: blur(8px); font-size: 0.75rem; font-weight: 500; 
            font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;
        }
        .btn-lux:active { background: var(--rosa); color: var(--azul-escuro); border-color: var(--rosa); transform: scale(0.95); }

        .empty-state { text-align: center; color: var(--prata-escuro); margin-top: 50px; font-size: 0.9rem; grid-column: span 2;}

        /* === MENU INFERIOR === */
        .bottom-nav {
            height: 75px; background: rgba(4, 8, 20, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
            display: none; justify-content: space-around; align-items: center; width: 100%; z-index: 100; backdrop-filter: blur(15px);
            position: fixed; bottom: 0; left: 0;
        }
        .nav-item {
            color: var(--prata-escuro); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; cursor: pointer; 
            padding: 12px 25px; border-radius: 30px; letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .nav-item.active { background: rgba(244, 172, 183, 0.1); color: var(--rosa); border: 1px solid rgba(244, 172, 183, 0.2);}
    </style>
</head>
<body>

    <!-- 0. PAINEL DE CONFIGURAÇÃO (ADMIN) -->
    <div id="admin-screen" class="screen">
        <div class="admin-box">
            <h2>Painel da Festa</h2>
            <p>Escolha o dia e horário em que as fotos coletivas serão reveladas para você e para os convidados.</p>
            
            <input type="datetime-local" id="data-input" class="date-input">
            <button class="btn-acao btn-rosa" onclick="gerarLink()">Gerar Link para o QR Code</button>

            <div id="link-gerado-container">
                <p style="font-size: 0.75rem; margin-bottom: 8px; color: #fff;">Copie este link e crie o seu QR Code:</p>
                <div class="link-text" id="link-text"></div>
                <button class="btn-acao" onclick="copiarLink()">Copiar Link</button>
            </div>
        </div>
    </div>

    <!-- 1. TELA DE LOGIN DO CONVIDADO -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1 class="login-title">Ana Julia</h1>
            <p class="login-subtitle">Registre os momentos na sua perspectiva!</p>
            <input type="text" id="input-nome" class="lux-input" placeholder="Seu nome" autocomplete="off">
            <button class="btn-acao" onclick="entrarNoSistema()">Ligar Câmera</button>
        </div>
    </div>

    <!-- 2. TELA DA CÂMERA -->
    <div id="camera-screen" class="screen">
        <div id="status-toast" class="status-toast"></div>
        <video id="video-preview" autoplay playsinline></video>
        <div class="capture-wrapper">
            <button class="capture-btn" id="btn-tirar-foto" onclick="tirarFoto()"></button>
        </div>
        <canvas id="canvas-escondido" style="display: none;"></canvas>
    </div>

    <!-- 3. TELA DA GALERIA COLETIVA -->
    <div id="gallery-screen" class="screen">
        <div class="gallery-header">
            <h2 style="font-size: 2.5rem;">Álbum da Festa</h2>
            <div class="timer-revelacao" id="timer-display">Calculando tempo...</div>
        </div>
        <div class="grid-galeria" id="grid-fotos">
            <div class="empty-state">Carregando fotos...</div>
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <div id="bottom-menu" class="bottom-nav">
        <div class="nav-item active" id="nav-camera" onclick="mudarAba('camera')">
            <span style="font-size: 1.1rem;">📷</span> Câmera
        </div>
        <div class="nav-item" id="nav-galeria" onclick="mudarAba('galeria')">
            <span style="font-size: 1.1rem;">🔒</span> Galeria
        </div>
    </div>

    <script>
        // ==========================================
        // CHAVES DO FIREBASE (PROJETO: ana-julia-4539a)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBO54dR0ngrdoT2DfjTv1iopt-1iGaG5Zg",
            authDomain: "ana-julia-4539a.firebaseapp.com",
            projectId: "ana-julia-4539a",
            storageBucket: "ana-julia-4539a.firebasestorage.app",
            messagingSenderId: "728961511590",
            appId: "1:728961511590:web:2444384e1387993e900467",
            measurementId: "G-X45YK6KP2N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let nomeConvidado = "";
        let streamDeVideo = null;
        let timestampRevelacao = 0;

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-escondido');
        const statusToast = document.getElementById('status-toast');
        const btnCaptura = document.getElementById('btn-tirar-foto');
        let timerInterval = null;

        // ==========================================
        // CONTROLE DE TELAS POR URL
        // ==========================================
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));

            if (!dataParam) {
                document.getElementById('admin-screen').classList.add('active');
            } else {
                timestampRevelacao = new Date(dataParam).getTime();
                document.getElementById('login-screen').classList.add('active');
            }
        };

        function gerarLink() {
            const dataEscolhida = document.getElementById('data-input').value;
            if(!dataEscolhida) { alert("Por favor, selecione a data e o horário da revelação!"); return; }

            const urlLimpa = window.location.href.split('?')[0];
            const linkFinal = `${urlLimpa}?data=${dataEscolhida}`;
            
            document.getElementById('link-text').innerText = linkFinal;
            document.getElementById('link-gerado-container').style.display = 'block';
        }

        function copiarLink() {
            const link = document.getElementById('link-text').innerText;
            navigator.clipboard.writeText(link).then(() => { 
                alert("Link copiado com sucesso! Crie o seu QR Code com ele."); 
            });
        }

        // ==========================================
        // SISTEMA DO CONVIDADO
        // ==========================================
        function entrarNoSistema() {
            const nome = document.getElementById('input-nome').value.trim();
            if(!nome) { alert("Por favor, digite seu nome!"); return; }
            nomeConvidado = nome;
            
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('bottom-menu').style.display = 'flex';
            mudarAba('camera');
            iniciarEscutaGaleria();
        }

        function mudarAba(aba) {
            document.getElementById('camera-screen').classList.remove('active');
            document.getElementById('gallery-screen').classList.remove('active');
            document.getElementById('nav-camera').classList.remove('active');
            document.getElementById('nav-galeria').classList.remove('active');

            if(aba === 'camera') {
                document.getElementById('camera-screen').classList.add('active');
                document.getElementById('nav-camera').classList.add('active');
                iniciarCamera();
                pararContadorTempoReal();
            } else {
                document.getElementById('gallery-screen').classList.add('active');
                document.getElementById('nav-galeria').classList.add('active');
                pararCamera();
                atualizarInterfaceGaleria();
                iniciarContadorTempoReal(); // Ativa o relógio rodando segundo a segundo
            }
        }

        async function iniciarCamera() {
            try {
                streamDeVideo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = streamDeVideo;
            } catch (err) { alert("Erro na câmera. Verifique as permissões do navegador."); }
        }

        function pararCamera() {
            if(streamDeVideo) { streamDeVideo.getTracks().forEach(track => track.stop()); }
        }

        function mostrarToast(msg, cor = 'var(--rosa)') {
            statusToast.innerHTML = msg;
            statusToast.style.borderColor = cor;
            statusToast.style.display = 'block';
        }

        function fecharToast() { statusToast.style.display = 'none'; }

        function tirarFoto() {
            btnCaptura.style.pointerEvents = 'none';
            video.style.opacity = '0.3';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            mostrarToast("Salvando no <br>Álbum da Festa... ⏳");

            const larguraMaxima = 600;
            const proporcao = video.videoHeight / video.videoWidth;
            canvas.width = larguraMaxima;
            canvas.height = larguraMaxima * proporcao;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.5);

            db.collection("album_coletivo").add({
                imagemTexto: fotoBase64,
                autor: nomeConvidado,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                mostrarToast("Foto salva no álbum! ✨", "#4caf50");
                setTimeout(fecharToast, 2500);
                btnCaptura.style.pointerEvents = 'auto';
            }).catch(() => {
                mostrarToast("Erro de conexão.", "red");
                setTimeout(fecharToast, 2500);
                btnCaptura.style.pointerEvents = 'auto';
            });
        }

        // ==========================================
        // CONTAGEM REGRESSIVA EM TEMPO REAL (SEGUNDO A SEGUNDO)
        // ==========================================
        function checarRevelacao() {
            const agora = new Date().getTime();
            const faltam = timestampRevelacao - agora;
            const timerEl = document.getElementById('timer-display');
            const menuIcon = document.getElementById('nav-galeria');

            if (faltam <= 0) {
                timerEl.innerText = "✨ ÁLBUM REVELADO ✨";
                timerEl.style.borderColor = "#4caf50"; 
                timerEl.style.color = "#4caf50";
                menuIcon.innerHTML = '<span style="font-size: 1.1rem;">🖼️</span> Galeria';
                return true; 
            } else {
                const horas = Math.floor(faltam / (1000 * 60 * 60));
                const min = Math.floor((faltam % (1000 * 60 * 60)) / (1000 * 60));
                const seg = Math.floor((faltam % (1000 * 60)) / 1000);
                
                // Formato elegante com segundos rodando
                timerEl.innerText = `Revelação em: ${horas}h ${min}m ${seg}s 🔒`;
                menuIcon.innerHTML = '<span style="font-size: 1.1rem;">🔒</span> Secreta';
                return false; 
            }
        }

        function iniciarContadorTempoReal() {
            pararContadorTempoReal();
            timerInterval = setInterval(() => {
                if(document.getElementById('gallery-screen').classList.contains('active')) {
                    const reveladoAgora = checarRevelacao();
                    // Se virou o tempo exato agora, atualiza a galeria para remover o blur na hora
                    if(reveladoAgora && document.querySelector('.foto-card.bloqueada')) {
                        atualizarInterfaceGaleria();
                    }
                }
            }, 1000); // Atualiza a cada 1 segundo em ponto
        }

        function pararContadorTempoReal() {
            if(timerInterval) { clearInterval(timerInterval); }
        }

        let cacheFotos = [];

        function iniciarEscutaGaleria() {
            db.collection("album_coletivo")
                .orderBy("timestamp", "desc")
                .onSnapshot((querySnapshot) => {
                    cacheFotos = [];
                    querySnapshot.forEach((doc) => { cacheFotos.push(doc.data()); });
                    if(document.getElementById('gallery-screen').classList.contains('active')) {
                        atualizarInterfaceGaleria();
                    }
                });
        }

        function atualizarInterfaceGaleria() {
            const revelado = checarRevelacao();
            const grid = document.getElementById('grid-fotos');
            grid.innerHTML = ''; 
            
            if (cacheFotos.length === 0) {
                grid.innerHTML = '<div class="empty-state">Ninguém tirou foto ainda.<br>Seja o primeiro!</div>';
                return;
            }

            cacheFotos.forEach((dados, index) => {
                const div = document.createElement('div');
                div.className = revelado ? 'foto-card' : 'foto-card bloqueada';
                const nomeArquivo = `15Anos_Por_${dados.autor.replace(/\s+/g, '')}_${index}.jpg`;
                
                let htmlCard = `<img src="${dados.imagemTexto}" alt="Foto">`;
                
                if (!revelado) {
                    htmlCard += `
                    <div class="lock-overlay">
                        <div class="lock-icon">🔒</div>
                        <div class="foto-autor">Por: ${dados.autor}</div>
                    </div>`;
                } else {
                    // Botões de luxo atualizados com direcionamento otimizado para galeria
                    htmlCard += `
                    <div class="foto-actions">
                        <button class="btn-lux" onclick="baixarFotoGaleria('${dados.imagemTexto}', '${nomeArquivo}')">
                            <span>⬇️</span> Baixar
                        </button>
                        <button class="btn-lux" onclick="compartilharFoto('${dados.imagemTexto}', '${nomeArquivo}')">
                            <span>📤</span> Enviar
                        </button>
                    </div>`;
                }
                div.innerHTML = htmlCard;
                grid.appendChild(div);
            });
        }

        // ==========================================
        // DOWNLOAD DIRECIONADO PARA O ROLO DA CÂMERA
        // ==========================================
        function baixarFotoGaleria(dataUrl, nomeArquivo) {
            fetch(dataUrl)
                .then(res => res.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = nomeArquivo;
                    // Força o comportamento de clique simulado no DOM
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => {
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(link);
                    }, 100);
                })
                .catch(() => {
                    // Fallback se o navegador bloquear o blob direto
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = nomeArquivo;
                    a.target = '_blank';
                    a.click();
                });
        }

        async function compartilharFoto(dataUrl, nomeArquivo) {
            try {
                const res = await fetch(dataUrl); 
                const blob = await res.blob();
                const file = new File([blob], nomeArquivo, { type: 'image/jpeg' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ 
                        files: [file], 
                        title: '15 Anos Ana Julia', 
                        text: 'Olha que foto sensacional da festa! ✨' 
                    });
                } else { 
                    baixarFotoGaleria(dataUrl, nomeArquivo);
                }
            } catch (error) { 
                console.log('Compartilhamento cancelado ou indisponível'); 
            }
        }
    </script>
</body>
</html>
