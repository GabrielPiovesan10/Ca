<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera - 15 Anos Ana Julia</title>
    
    <!-- Meta tags básicas para ficar bonito no WhatsApp -->
    <meta property="og:title" content="Nossa Câmera Exclusiva 📸">
    <meta property="og:description" content="Tire fotos da festa na sua perspectiva. As fotos só serão reveladas amanhã!">
    <meta property="og:type" content="website">

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Versão Compatível) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

    <style>
        :root {
            --azul-escuro: #0a1128;
            --azul-fundo: #070c1d;
            --prata: #e0e0e0;
            --rosa: #f4acb7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--azul-fundo);
            font-family: 'Montserrat', sans-serif;
            color: var(--prata);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        h1, h2 { font-family: 'Great Vibes', cursive; color: var(--rosa); text-align: center; font-weight: normal;}
        
        /* === TELAS === */
        .screen {
            display: none;
            flex: 1;
            width: 100%;
            height: calc(100% - 70px); /* Desconta o menu inferior */
            overflow-y: auto;
            position: relative;
        }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        /* === TELA DE LOGIN === */
        #login-screen { justify-content: center; padding: 20px; }
        .login-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--prata);
            padding: 30px 20px; border-radius: 20px; backdrop-filter: blur(10px);
            text-align: center; width: 100%; max-width: 350px;
        }
        .login-box input {
            width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px;
            border: 1px solid var(--prata); background: rgba(0,0,0,0.5);
            color: #fff; font-size: 1rem; text-align: center; outline: none;
        }
        .btn-acao {
            background: linear-gradient(135deg, #ffffff 0%, #a8a8a8 100%);
            color: var(--azul-escuro); border: none; padding: 15px 30px;
            border-radius: 30px; font-size: 1rem; font-weight: 600;
            cursor: pointer; width: 100%; text-transform: uppercase;
        }

        /* === TELA DA CÂMERA === */
        #camera-screen { background: #000; justify-content: center; overflow: hidden; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        .capture-btn {
            position: absolute; bottom: 30px; width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.3); border: 4px solid #fff;
            border-radius: 50%; cursor: pointer; z-index: 10;
        }
        .capture-btn:active { background: #fff; }
        .status-toast {
            position: absolute; top: 20px; background: rgba(10, 17, 40, 0.9);
            padding: 12px 25px; border-radius: 30px; border: 1px solid var(--rosa);
            font-size: 0.9rem; display: none; z-index: 20; color: #fff; font-weight: bold;
        }

        /* === TELA DA GALERIA === */
        #gallery-screen { padding: 20px; justify-content: flex-start; }
        .gallery-header { margin-bottom: 20px; text-align: center; width: 100%; }
        .timer-revelacao { font-size: 0.85rem; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--rosa); display: inline-block; margin-top: 10px;}
        
        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            padding-bottom: 30px;
        }
        .foto-card {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .foto-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: filter 0.5s ease;
        }
        /* Efeito de cadeado e borrão */
        .foto-card.bloqueada img { filter: blur(15px) grayscale(50%); }
        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.3); z-index: 2;
        }
        .lock-icon { font-size: 2rem; margin-bottom: 5px; }
        .foto-autor { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 3px #000;}

        /* === MENU INFERIOR === */
        .bottom-nav {
            height: 70px; background: rgba(7, 12, 29, 0.95);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center;
            position: fixed; bottom: 0; width: 100%; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            color: var(--prata); font-size: 0.8rem; text-transform: uppercase;
            font-weight: 600; cursor: pointer; padding: 10px 20px; border-radius: 20px;
        }
        .nav-item.active { background: rgba(244, 172, 183, 0.1); color: var(--rosa); }
        
        /* Esconde o menu na tela de login */
        #bottom-menu { display: none; }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1 style="font-size: 3rem;">Ana Julia 15</h1>
            <p style="font-size: 0.9rem; margin-top: 10px;">Registre os momentos na sua perspectiva!</p>
            <input type="text" id="nome-convidado" placeholder="Digite seu nome" autocomplete="off">
            <button class="btn-acao" onclick="entrarNoSistema()">Ligar Câmera</button>
        </div>
    </div>

    <!-- 2. TELA DA CÂMERA -->
    <div id="camera-screen" class="screen">
        <div id="status-toast" class="status-toast"></div>
        <video id="video-preview" autoplay playsinline></video>
        <button class="capture-btn" onclick="tirarFoto()"></button>
        <canvas id="canvas-escondido" style="display: none;"></canvas>
    </div>

    <!-- 3. TELA DA GALERIA -->
    <div id="gallery-screen" class="screen">
        <div class="gallery-header">
            <h2 style="font-size: 2.5rem;">Álbum Exclusivo</h2>
            <div class="timer-revelacao" id="timer-display">Calculando...</div>
        </div>
        <div class="grid-galeria" id="grid-fotos">
            <!-- As fotos vão aparecer aqui via JavaScript -->
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <div id="bottom-menu" class="bottom-nav">
        <div class="nav-item active" id="nav-camera" onclick="mudarAba('camera')">📸 Câmera</div>
        <div class="nav-item" id="nav-galeria" onclick="mudarAba('galeria')">🖼️ Galeria</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE
        // Substitua pelas chaves do seu projeto Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Variáveis de Controle
        let nomeConvidado = "";
        let streamDeVideo = null;
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-escondido');
        const statusToast = document.getElementById('status-toast');
        
        // ==========================================
        // REGRA DE REVELAÇÃO (DATA E HORA)
        // Está programado para 17 de Outubro de 2026 às 12h00
        // ==========================================
        const dataRevelacao = new Date('2026-10-17T12:00:00').getTime();

        // ==========================================
        // LÓGICA DE NAVEGAÇÃO
        // ==========================================
        function entrarNoSistema() {
            const input = document.getElementById('nome-convidado').value.trim();
            if(!input) { alert("Por favor, informe seu nome!"); return; }
            
            nomeConvidado = input;
            
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('bottom-menu').style.display = 'flex';
            mudarAba('camera');
        }

        function mudarAba(aba) {
            document.getElementById('camera-screen').classList.remove('active');
            document.getElementById('gallery-screen').classList.remove('active');
            document.getElementById('nav-camera').classList.remove('active');
            document.getElementById('nav-galeria').classList.remove('active');

            if(aba === 'camera') {
                document.getElementById('camera-screen').classList.add('active');
                document.getElementById('nav-camera').classList.add('active');
                iniciarCamera(); // Liga a câmera ao entrar na aba
            } else {
                document.getElementById('gallery-screen').classList.add('active');
                document.getElementById('nav-galeria').classList.add('active');
                pararCamera(); // Desliga a câmera para economizar bateria
                carregarGaleria();
            }
        }

        // ==========================================
        // CÂMERA E CAPTURA
        // ==========================================
        async function iniciarCamera() {
            try {
                streamDeVideo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, // Tenta forçar a câmera traseira
                    audio: false
                });
                video.srcObject = streamDeVideo;
            } catch (err) {
                alert("Erro ao acessar a câmera. Tente usar o Safari ou Chrome e permita o acesso.");
            }
        }

        function pararCamera() {
            if(streamDeVideo) {
                streamDeVideo.getTracks().forEach(track => track.stop());
            }
        }

        function mostrarToast(msg, cor = 'var(--rosa)') {
            statusToast.innerText = msg;
            statusToast.style.borderColor = cor;
            statusToast.style.display = 'block';
            setTimeout(() => { statusToast.style.display = 'none'; }, 3000);
        }

        function tirarFoto() {
            mostrarToast("Enviando foto... ⏳");
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                const idUnico = new Date().getTime();
                const nomeArquivo = `fotos/${idUnico}.jpg`;
                const ref = storage.ref().child(nomeArquivo);

                // Sobe a imagem para o Storage
                ref.put(blob).then((snapshot) => {
                    // Pega o link da imagem
                    snapshot.ref.getDownloadURL().then((urlImagem) => {
                        // Salva os dados no banco de dados Firestore
                        db.collection("album_anajulia").add({
                            url: urlImagem,
                            autor: nomeConvidado,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            mostrarToast("Foto salva no álbum! ✨", "#4caf50");
                        });
                    });
                }).catch((erro) => {
                    mostrarToast("Erro ao enviar.", "red");
                });
            }, 'image/jpeg', 0.8);
        }

        // ==========================================
        // GALERIA E MÁGICA DA REVELAÇÃO
        // ==========================================
        function atualizarTimer() {
            const agora = new Date().getTime();
            const faltam = dataRevelacao - agora;
            const timerEl = document.getElementById('timer-display');

            if (faltam <= 0) {
                timerEl.innerText = "✨ Álbum Revelado! ✨";
                timerEl.style.borderColor = "#4caf50";
                timerEl.style.color = "#4caf50";
                return true; // Já revelou
            } else {
                const horas = Math.floor(faltam / (1000 * 60 * 60));
                const min = Math.floor((faltam % (1000 * 60 * 60)) / (1000 * 60));
                timerEl.innerText = `Revelação em: ${horas}h e ${min}m 🔒`;
                return false; // Ainda bloqueado
            }
        }

        function carregarGaleria() {
            const fotosReveladas = atualizarTimer();
            const grid = document.getElementById('grid-fotos');
            grid.innerHTML = '<p style="grid-column: span 2; text-align: center;">Carregando...</p>';

            // Puxa as fotos do banco de dados ordenadas da mais recente para a mais antiga
            db.collection("album_anajulia").orderBy("timestamp", "desc").get().then((querySnapshot) => {
                grid.innerHTML = ''; // Limpa o carregando
                
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align: center;">Nenhuma foto tirada ainda.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    
                    // Monta o Card da Foto
                    const div = document.createElement('div');
                    div.className = fotosReveladas ? 'foto-card' : 'foto-card bloqueada';
                    
                    let htmlCard = `<img src="${dados.url}" alt="Foto">`;
                    
                    // Se não estiver revelado, coloca o cadeado e o nome de quem tirou por cima
                    if (!fotosReveladas) {
                        htmlCard += `
                        <div class="lock-overlay">
                            <div class="lock-icon">🔒</div>
                            <div class="foto-autor">Por: ${dados.autor}</div>
                        </div>`;
                    }
                    
                    div.innerHTML = htmlCard;
                    grid.appendChild(div);
                });
            });
        }

        // Atualiza o reloginho a cada 1 minuto se estiver na aba da galeria
        setInterval(() => {
            if(document.getElementById('gallery-screen').classList.contains('active')) {
                const agoraRevelou = atualizarTimer();
                // Se a contagem zerou exatamente agora enquanto o cara tá com a tela aberta, recarrega as imagens pra tirar o borrão
                if(agoraRevelou && document.querySelector('.foto-card.bloqueada')) {
                    carregarGaleria();
                }
            }
        }, 60000);

    </script>
</body>
</html>
