<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera - 15 Anos Ana Julia</title>
    
    <meta property="og:title" content="Câmera Exclusiva 📸">
    <meta property="og:description" content="Registre os momentos na sua perspectiva!">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --azul-escuro: #0a1128;
            --azul-fundo: #040814;
            --prata: #e0e0e0;
            --prata-escuro: #888888;
            --rosa: #f4acb7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--azul-fundo); font-family: 'Montserrat', sans-serif;
            color: var(--prata); display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(circle at top, #0a1128 0%, #040814 100%);
        }

        h1, h2 { font-family: 'Great Vibes', cursive; color: var(--rosa); text-align: center; font-weight: normal;}
        
        .screen { display: none; width: 100%; height: 100dvh; position: absolute; top: 0; left: 0; overflow-y: auto; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #camera-screen.active, #gallery-screen.active { 
            height: calc(100dvh - 75px); 
            justify-content: flex-start;
            position: relative;
        }
        #camera-screen.active { justify-content: center; overflow: hidden; }

        /* === TELA ADMIN === */
        .admin-box {
            background: rgba(10, 17, 40, 0.95); border: 1px solid var(--rosa);
            padding: 30px 20px; border-radius: 24px; text-align: center; width: 90%; max-width: 380px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            margin: auto; max-height: 90vh; overflow-y: auto;
        }
        .admin-box h2 { font-size: 3rem; margin-bottom: 5px; }
        .admin-box p { font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; color: var(--prata-escuro);}
        
        .date-input {
            width: 100%; padding: 14px; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid rgba(224, 224, 224, 0.2); background: rgba(0,0,0,0.5); color: #fff;
            font-family: 'Montserrat', sans-serif; outline: none; text-align: center; font-size: 0.95rem;
        }
        .date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        #link-gerado-container { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .link-text { font-size: 0.75rem; background: #000; padding: 10px; border-radius: 8px; word-break: break-all; color: var(--rosa); margin-bottom: 12px; border: 1px dashed rgba(244, 172, 183, 0.3);}

        /* === TELA LOGIN === */
        .login-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(224, 224, 224, 0.15);
            padding: 35px 20px; border-radius: 24px; backdrop-filter: blur(15px);
            text-align: center; width: 90%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .login-title { font-size: 3.2rem; margin-bottom: 2px; text-shadow: 0 2px 10px rgba(244, 172, 183, 0.3); }
        .login-subtitle { font-size: 0.8rem; color: var(--prata-escuro); margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; text-transform: uppercase;}
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .lux-input {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 1px solid rgba(224, 224, 224, 0.2); background: rgba(0,0,0,0.4);
            color: #fff; font-size: 0.9rem; text-align: center; outline: none; transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        .lux-input::placeholder { color: rgba(224, 224, 224, 0.4); }
        .lux-input:focus { border-color: var(--rosa); box-shadow: 0 0 15px rgba(244, 172, 183, 0.2); }

        .btn-acao {
            background: linear-gradient(135deg, var(--prata) 0%, #999 100%); color: var(--azul-fundo);
            border: none; padding: 15px 30px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1); transition: all 0.3s ease;
        }
        .btn-acao:active { transform: scale(0.97); }
        .btn-rosa { background: var(--rosa); color: #000; }

        /* === TELA CÂMERA === */
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* Controles Superiores da Câmera (Flash e Virar Câmera) */
        .camera-controls-top {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 30;
        }
        .camera-btn-top {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; backdrop-filter: blur(10px); font-size: 1.2rem;
            transition: all 0.2s ease;
        }
        .camera-btn-top.ativo { background: var(--rosa); color: var(--azul-escuro); border-color: var(--rosa); }

        .capture-wrapper { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .capture-btn {
            width: 75px; height: 75px; background: rgba(255, 255, 255, 0.2); border: 3px solid #fff;
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s ease;
        }
        .capture-btn:active { background: #fff; transform: scale(0.9); }
        
        .status-toast {
            position: absolute; top: 20px; left: 20px; background: rgba(4, 8, 20, 0.85); padding: 12px 20px; border-radius: 30px; border: 1px solid var(--rosa);
            font-size: 0.75rem; display: none; z-index: 20; color: #fff; font-weight: 500; backdrop-filter: blur(10px); letter-spacing: 1px; text-transform: uppercase; text-align: center;
        }

        /* === TELA GALERIA === */
        #gallery-screen { padding: 25px 15px; }
        .gallery-header { margin-bottom: 20px; text-align: center; width: 100%; }
        .timer-revelacao { font-size: 0.8rem; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--rosa); display: inline-block; margin-top: 8px; letter-spacing: 0.5px;}
        
        .lista-albuns { display: flex; flex-direction: column; gap: 12px; width: 100%; padding-bottom: 40px; }
        .album-card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .album-card:active { background: rgba(244, 172, 183, 0.1); border-color: var(--rosa); }
        .album-info h3 { font-size: 1.1rem; color: #fff; font-weight: 600; margin-bottom: 3px; font-family: 'Montserrat', sans-serif;}
        .album-info p { font-size: 0.75rem; color: var(--prata-escuro); text-transform: uppercase; letter-spacing: 1px;}
        .album-arrow { font-size: 1.2rem; color: var(--rosa); }

        .detalhe-topo { display: flex; align-items: center; margin-bottom: 20px; width: 100%; gap: 15px; }
        .btn-voltar {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-family: 'Montserrat', sans-serif;
        }
        
        .titulo-album-autor {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .grid-fotos-autor { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; padding-bottom: 40px; }
        
        .foto-card {
            position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; 
            background: #111; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer;
        }
        .foto-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: filter 0.5s ease; z-index: 1; }
        
        .foto-card.bloqueada img { filter: blur(15px) grayscale(30%); }
        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); z-index: 2;
        }
        .lock-icon { font-size: 2rem; margin-bottom: 5px; }

        .foto-actions {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 6px 4px; 
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; justify-content: space-around; gap: 4px; z-index: 4;
        }
        .btn-lux {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; 
            padding: 4px 8px; border-radius: 14px; display: flex; align-items: center; gap: 4px;
            cursor: pointer; backdrop-filter: blur(8px); font-size: 0.6rem; font-weight: 600; 
            font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-lux svg { width: 12px; height: 12px; fill: currentColor; }
        .btn-lux:active { background: var(--rosa); color: var(--azul-escuro); border-color: var(--rosa); transform: scale(0.95); }

        /* === LIGHTBOX / TELA CHEIA DA FOTO === */
        #lightbox-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            background: rgba(0, 0, 0, 0.95); z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; backdrop-filter: blur(15px);
        }
        #lightbox-modal.active { display: flex; }
        #lightbox-img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .lightbox-close {
            position: absolute; top: 25px; right: 25px; background: rgba(255,255,255,0.2); border: none; color: #fff;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .empty-state { text-align: center; color: var(--prata-escuro); margin-top: 50px; font-size: 0.9rem; grid-column: span 2;}

        /* === MENU INFERIOR === */
        .bottom-nav {
            height: 75px; background: rgba(4, 8, 20, 0.95); border-top: 1px solid rgba(255,255,255,0.08);
            display: none; justify-content: space-around; align-items: center; width: 100%; z-index: 100; backdrop-filter: blur(15px);
            position: fixed; bottom: 0; left: 0;
        }
        .nav-item {
            color: var(--prata-escuro); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; cursor: pointer; 
            padding: 12px 25px; border-radius: 30px; letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .nav-item.active { background: rgba(244, 172, 183, 0.1); color: var(--rosa); border: 1px solid rgba(244, 172, 183, 0.2);}
    </style>
</head>
<body>

    <!-- 0. PAINEL ADMIN -->
    <div id="admin-screen" class="screen">
        <div class="admin-box">
            <h2>Painel da Festa</h2>
            <p>Escolha o dia e horário em que os álbuns coletivos serão revelados para você e para os convidados.</p>
            
            <input type="datetime-local" id="data-input" class="date-input">
            <button class="btn-acao btn-rosa" onclick="gerarLink()">Gerar Link para o QR Code</button>

            <div id="link-gerado-container">
                <p style="font-size: 0.75rem; margin-bottom: 8px; color: #fff;">Copie este link e crie o seu QR Code:</p>
                <div class="link-text" id="link-text"></div>
                <button class="btn-acao" onclick="copiarLink()">Copiar Link</button>
            </div>
        </div>
    </div>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1 class="login-title">Ana Julia</h1>
            <p class="login-subtitle">Registre os momentos na sua perspectiva!</p>
            
            <div class="input-group">
                <input type="text" id="input-nome" class="lux-input" placeholder="Nome" autocomplete="off">
                <input type="text" id="input-sobrenome" class="lux-input" placeholder="Sobrenome" autocomplete="off">
            </div>

            <button class="btn-acao" onclick="entrarNoSistema()">Ligar Câmera</button>
        </div>
    </div>

    <!-- 2. TELA DA CÂMERA -->
    <div id="camera-screen" class="screen">
        <div id="status-toast" class="status-toast"></div>
        
        <!-- Controles Superiores (Flash e Alternar Câmera) -->
        <div class="camera-controls-top">
            <button class="camera-btn-top" id="btn-camera-switch" onclick="alternarCamera()" title="Virar Câmera">🔄</button>
            <button class="camera-btn-top" id="btn-flash" onclick="toggleFlash()" title="Ativar Flash">⚡</button>
        </div>

        <video id="video-preview" autoplay playsinline></video>
        <div class="capture-wrapper">
            <button class="capture-btn" id="btn-tirar-foto" onclick="tirarFoto()"></button>
        </div>
        <canvas id="canvas-escondido" style="display: none;"></canvas>
    </div>

    <!-- 3. TELA DA GALERIA -->
    <div id="gallery-screen" class="screen">
        <div class="gallery-header">
            <h2 style="font-size: 2.3rem;">Álbuns da Festa</h2>
            <div class="timer-revelacao" id="timer-display">Calculando tempo...</div>
        </div>
        <div class="lista-albuns" id="container-albuns">
            <div class="empty-state">Carregando álbuns...</div>
        </div>
    </div>

    <!-- MODAL DE TELA CHEIA (LIGHTBOX) -->
    <div id="lightbox-modal" onclick="fecharLightbox(event)">
        <button class="lightbox-close" onclick="fecharLightbox(event)">✕</button>
        <img id="lightbox-img" src="" alt="Foto Ampliada">
    </div>

    <!-- MENU INFERIOR -->
    <div id="bottom-menu" class="bottom-nav">
        <div class="nav-item active" id="nav-camera" onclick="mudarAba('camera')">
            <span style="font-size: 1.1rem;">📷</span> Câmera
        </div>
        <div class="nav-item" id="nav-galeria" onclick="mudarAba('galeria')">
            <span style="font-size: 1.1rem;">🔒</span> Álbuns
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBO54dR0ngrdoT2DfjTv1iopt-1iGaG5Zg",
            authDomain: "ana-julia-4539a.firebaseapp.com",
            projectId: "ana-julia-4539a",
            storageBucket: "ana-julia-4539a.firebasestorage.app",
            messagingSenderId: "728961511590",
            appId: "1:728961511590:web:2444384e1387993e900467",
            measurementId: "G-X45YK6KP2N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let nomeCompletoConvidado = "";
        let streamDeVideo = null;
        let trackDeVideo = null;
        let flashLigado = false;
        let usandoCameraFrontal = false;
        let timestampRevelacao = 0;
        let autorSelecionado = null;

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-escondido');
        const statusToast = document.getElementById('status-toast');
        const btnCaptura = document.getElementById('btn-tirar-foto');
        const btnFlash = document.getElementById('btn-flash');
        const btnSwitch = document.getElementById('btn-camera-switch');
        let timerInterval = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));

            if (!dataParam) {
                document.getElementById('admin-screen').classList.add('active');
            } else {
                timestampRevelacao = new Date(dataParam).getTime();
                const nomeSalvo = localStorage.getItem('anajulia_convidado_completo');
                if (nomeSalvo) {
                    nomeCompletoConvidado = nomeSalvo;
                    document.getElementById('bottom-menu').style.display = 'flex';
                    mudarAba('camera');
                    iniciarEscutaGaleria();
                } else {
                    document.getElementById('login-screen').classList.add('active');
                }
            }
        };

        function gerarLink() {
            const dataEscolhida = document.getElementById('data-input').value;
            if(!dataEscolhida) { alert("Por favor, selecione a data e o horário da revelação!"); return; }

            const urlLimpa = window.location.href.split('?')[0];
            const linkFinal = `${urlLimpa}?data=${dataEscolhida}`;
            
            document.getElementById('link-text').innerText = linkFinal;
            document.getElementById('link-gerado-container').style.display = 'block';
        }

        function copiarLink() {
            const link = document.getElementById('link-text').innerText;
            navigator.clipboard.writeText(link).then(() => { alert("Link copiado!"); });
        }

        function entrarNoSistema() {
            const nome = document.getElementById('input-nome').value.trim();
            const sobrenome = document.getElementById('input-sobrenome').value.trim();
            
            if(!nome) { alert("Por favor, digite seu nome!"); return; }
            
            nomeCompletoConvidado = `${nome} ${sobrenome}`.trim();
            localStorage.setItem('anajulia_convidado_completo', nomeCompletoConvidado);
            
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('bottom-menu').style.display = 'flex';
            mudarAba('camera');
            iniciarEscutaGaleria();
        }

        function mudarAba(aba) {
            document.getElementById('camera-screen').classList.remove('active');
            document.getElementById('gallery-screen').classList.remove('active');
            document.getElementById('nav-camera').classList.remove('active');
            document.getElementById('nav-galeria').classList.remove('active');

            if(aba === 'camera') {
                document.getElementById('camera-screen').classList.add('active');
                document.getElementById('nav-camera').classList.add('active');
                autorSelecionado = null;
                iniciarCamera();
                pararContadorTempoReal();
            } else {
                document.getElementById('gallery-screen').classList.add('active');
                document.getElementById('nav-galeria').classList.add('active');
                pararCamera();
                atualizarInterfaceGaleria();
                iniciarContadorTempoReal();
            }
        }

        async function iniciarCamera() {
            try {
                if (streamDeVideo) {
                    streamDeVideo.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: { facingMode: usandoCameraFrontal ? 'user' : 'environment' },
                    audio: false
                };
                streamDeVideo = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = streamDeVideo;
                trackDeVideo = streamDeVideo.getVideoTracks()[0];
                
                // Gerencia o botão de flash (se for frontal, esconde o flash)
                if (usandoCameraFrontal) {
                    btnFlash.style.display = 'none';
                } else {
                    const capabilities = trackDeVideo.getCapabilities ? trackDeVideo.getCapabilities() : {};
                    if (!capabilities.torch) {
                        btnFlash.style.display = 'none';
                    } else {
                        btnFlash.style.display = 'flex';
                    }
                }
            } catch (err) { alert("Erro ao acessar a câmera. Verifique as permissões."); }
        }

        function pararCamera() {
            if (flashLigado && trackDeVideo) {
                trackDeVideo.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
                flashLigado = false;
                btnFlash.classList.remove('ativo');
            }
            if(streamDeVideo) { streamDeVideo.getTracks().forEach(track => track.stop()); }
        }

        function alternarCamera() {
            usandoCameraFrontal = !usandoCameraFrontal;
            if (flashLigado) {
                flashLigado = false;
                btnFlash.classList.remove('ativo');
            }
            iniciarCamera();
        }

        // ==========================================
        // CONTROLE DO FLASH OTIMIZADO
        // ==========================================
        async function toggleFlash() {
            if (!trackDeVideo) return;
            try {
                flashLigado = !flashLigado;
                await trackDeVideo.applyConstraints({ advanced: [{ torch: flashLigado }] });
                if (flashLigado) {
                    btnFlash.classList.add('ativo');
                    mostrarToast("⚡ Flash ativado!", "#4caf50");
                    setTimeout(fecharToast, 1500);
                } else {
                    btnFlash.classList.remove('ativo');
                }
            } catch (err) {
                // Caso o hardware precise de segundo toque para disparar o circuito
                try {
                    await trackDeVideo.applyConstraints({ advanced: [{ torch: true }] });
                    flashLigado = true;
                    btnFlash.classList.add('ativo');
                    mostrarToast("⚡ Flash pronto!", "#4caf50");
                    setTimeout(fecharToast, 1500);
                } catch (e) {
                    alert("Seu celular não suporta flash por navegador.");
                    flashLigado = false;
                }
            }
        }

        function mostrarToast(msg, cor = 'var(--rosa)') {
            statusToast.innerHTML = msg;
            statusToast.style.borderColor = cor;
            statusToast.style.display = 'block';
        }

        function fecharToast() { statusToast.style.display = 'none'; }

        function tirarFoto() {
            btnCaptura.style.pointerEvents = 'none';
            video.style.opacity = '0.3';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            mostrarToast("Salvando no <br>Álbum da Festa... ⏳");

            const larguraMaxima = 600;
            const proporcao = video.videoHeight / video.videoWidth;
            canvas.width = larguraMaxima;
            canvas.height = larguraMaxima * proporcao;
            
            const ctx = canvas.getContext('2d');
            if (usandoCameraFrontal) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.5);

            db.collection("album_coletivo").add({
                imagemTexto: fotoBase64,
                autor: nomeCompletoConvidado,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                mostrarToast("Foto salva no álbum! ✨", "#4caf50");
                setTimeout(fecharToast, 2500);
                btnCaptura.style.pointerEvents = 'auto';
            }).catch(() => {
                mostrarToast("Erro de conexão.", "red");
                setTimeout(fecharToast, 2500);
                btnCaptura.style.pointerEvents = 'auto';
            });
        }

        function checarRevelacao() {
            const agora = new Date().getTime();
            const faltam = timestampRevelacao - agora;
            const timerEl = document.getElementById('timer-display');
            const menuIcon = document.getElementById('nav-galeria');

            if (faltam <= 0) {
                timerEl.innerText = "✨ ÁLBUNS REVELADOS ✨";
                timerEl.style.borderColor = "#4caf50"; 
                timerEl.style.color = "#4caf50";
                menuIcon.innerHTML = '<span style="font-size: 1.1rem;">🖼️</span> Álbuns';
                return true; 
            } else {
                const horas = Math.floor(faltam / (1000 * 60 * 60));
                const min = Math.floor((faltam % (1000 * 60 * 60)) / (1000 * 60));
                const seg = Math.floor((faltam % (1000 * 60)) / 1000);
                
                timerEl.innerText = `Revelação em: ${horas}h ${min}m ${seg}s 🔒`;
                menuIcon.innerHTML = '<span style="font-size: 1.1rem;">🔒</span> Secreto';
                return false; 
            }
        }

        function iniciarContadorTempoReal() {
            pararContadorTempoReal();
            timerInterval = setInterval(() => {
                if(document.getElementById('gallery-screen').classList.contains('active')) {
                    const reveladoAgora = checarRevelacao();
                    if(reveladoAgora && document.querySelector('.foto-card.bloqueada')) {
                        atualizarInterfaceGaleria();
                    }
                }
            }, 1000);
        }

        function pararContadorTempoReal() {
            if(timerInterval) { clearInterval(timerInterval); }
        }

        let cacheFotos = [];

        function iniciarEscutaGaleria() {
            db.collection("album_coletivo")
                .orderBy("timestamp", "desc")
                .onSnapshot((querySnapshot) => {
                    cacheFotos = [];
                    querySnapshot.forEach((doc) => { cacheFotos.push(doc.data()); });
                    if(document.getElementById('gallery-screen').classList.contains('active')) {
                        atualizarInterfaceGaleria();
                    }
                });
        }

        function atualizarInterfaceGaleria() {
            const revelado = checarRevelacao();
            const container = document.getElementById('container-albuns');
            container.innerHTML = ''; 
            
            if (cacheFotos.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhuma foto tirada ainda.<br>Seja o primeiro!</div>';
                return;
            }

            if (autorSelecionado !== null) {
                renderizarDetalhesAlbum(autorSelecionado, revelado);
                return;
            }

            const albunsPorAutor = {};
            cacheFotos.forEach(foto => {
                const autor = foto.autor || "Convidado";
                if (!albunsPorAutor[autor]) {
                    albunsPorAutor[autor] = [];
                }
                albunsPorAutor[autor].push(foto);
            });

            for (const [autor, fotos] of Object.entries(albunsPorAutor)) {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => { autorSelecionado = autor; atualizarInterfaceGaleria(); };
                
                card.innerHTML = `
                    <div class="album-info">
                        <h3>Álbum de ${autor}</h3>
                        <p>${fotos.length} ${fotos.length === 1 ? 'foto registrada' : 'fotos registradas'}</p>
                    </div>
                    <div class="album-arrow">${revelado ? '📂' : '🔒'}</div>
                `;
                container.appendChild(card);
            }
        }

        function renderizarDetalhesAlbum(autor, revelado) {
            const container = document.getElementById('container-albuns');
            const fotosDoAutor = cacheFotos.filter(f => (f.autor || "Convidado") === autor);

            let html = `
                <div class="detalhe-topo">
                    <button class="btn-voltar" onclick="autorSelecionado = null; atualizarInterfaceGaleria();">← Voltar</button>
                    <h3 class="titulo-album-autor">Álbum de ${autor}</h3>
                </div>
                <div class="grid-fotos-autor">
            `;

            fotosDoAutor.forEach((dados, index) => {
                const classeBloqueio = revelado ? 'foto-card' : 'foto-card bloqueada';
                const nomeArquivo = `15Anos_Por_${autor.replace(/\s+/g, '')}_${index}.jpg`;
                
                // Se revelado, adiciona o evento de clique para abrir em tela cheia
                const clickAcao = revelado ? `onclick="abrirLightbox('${dados.imagemTexto}')"` : '';
                
                html += `<div class="${classeBloqueio}" ${clickAcao}>`;
                html += `<img src="${dados.imagemTexto}" alt="Foto">`;
                
                if (!revelado) {
                    html += `
                    <div class="lock-overlay">
                        <div class="lock-icon">🔒</div>
                    </div>`;
                } else {
                    html += `
                    <div class="foto-actions" onclick="event.stopPropagation()">
                        <button class="btn-lux" onclick="baixarFotoGaleria('${dados.imagemTexto}', '${nomeArquivo}')">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Baixar
                        </button>
                        <button class="btn-lux" onclick="compartilharFoto('${dados.imagemTexto}', '${nomeArquivo}')">
                            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.15c-.05.21-.08.43-.08.66 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Enviar
                        </button>
                    </div>`;
                }
                html += `</div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // ==========================================
        // VISUALIZADOR DE TELA CHEIA (LIGHTBOX)
        // ==========================================
        function abrirLightbox(dataUrl) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = dataUrl;
            modal.classList.add('active');
        }

        function fecharLightbox(event) {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('active');
        }

        function baixarFotoGaleria(dataUrl, nomeArquivo) {
            fetch(dataUrl).then(res => res.blob()).then(blob => {
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url; link.download = nomeArquivo;
                document.body.appendChild(link); link.click();
                setTimeout(() => { window.URL.revokeObjectURL(url); document.body.removeChild(link); }, 100);
            }).catch(() => {
                const a = document.createElement('a'); a.href = dataUrl; a.download = nomeArquivo; a.target = '_blank'; a.click();
            });
        }

        async function compartilharFoto(dataUrl, nomeArquivo) {
            try {
                const res = await fetch(dataUrl); const blob = await res.blob();
                const file = new File([blob], nomeArquivo, { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: '15 Anos Ana Julia', text: 'Olha que foto sensacional da festa! ✨' });
                } else { baixarFotoGaleria(dataUrl, nomeArquivo); }
            } catch (error) { console.log('Compartilhamento cancelado'); }
        }
    </script>
</body>
</html>
