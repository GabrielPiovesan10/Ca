<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera - 15 Anos Ana Julia</title>
    
    <meta property="og:title" content="Câmera Exclusiva 📸">
    <meta property="og:description" content="Registre os melhores momentos da festa e compartilhe!">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-escuro: #0a1128;
            --azul-fundo: #040814;
            --prata: #e0e0e0;
            --prata-escuro: #888888;
            --rosa: #f4acb7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--azul-fundo);
            font-family: 'Montserrat', sans-serif;
            color: var(--prata);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            background-image: radial-gradient(circle at top, #0a1128 0%, #040814 100%);
        }

        h1, h2 { font-family: 'Great Vibes', cursive; color: var(--rosa); text-align: center; font-weight: normal;}
        
        /* === ESTRUTURA DE TELAS === */
        .screen {
            display: none;
            width: 100%;
            height: calc(100dvh - 75px); /* Trava exata descontando o menu inferior */
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        /* === TELA DE LOGIN (LUXO) === */
        #login-screen { justify-content: center; padding: 20px; }
        .login-box {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(224, 224, 224, 0.15);
            padding: 40px 25px; 
            border-radius: 24px; 
            backdrop-filter: blur(15px);
            text-align: center; 
            width: 100%; 
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .login-title { font-size: 3.5rem; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(244, 172, 183, 0.3); }
        .login-subtitle { font-size: 0.85rem; color: var(--prata-escuro); margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; text-transform: uppercase;}
        
        .input-group {
            display: flex; gap: 10px; margin-bottom: 25px;
        }
        .lux-input {
            width: 100%; padding: 16px; border-radius: 12px;
            border: 1px solid rgba(224, 224, 224, 0.2); 
            background: rgba(0,0,0,0.4);
            color: #fff; font-size: 0.95rem; text-align: center; 
            outline: none; transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        .lux-input::placeholder { color: rgba(224, 224, 224, 0.4); }
        .lux-input:focus { border-color: var(--rosa); box-shadow: 0 0 15px rgba(244, 172, 183, 0.2); }

        .btn-acao {
            background: linear-gradient(135deg, var(--prata) 0%, #999 100%);
            color: var(--azul-fundo); border: none; padding: 16px 30px;
            border-radius: 30px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1); transition: all 0.3s ease;
        }
        .btn-acao:active { transform: scale(0.97); }

        /* === TELA DA CÂMERA === */
        #camera-screen { background: #000; justify-content: center; overflow: hidden; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* Botão corrigido: agora fica sempre seguro acima do menu */
        .capture-wrapper {
            position: absolute;
            bottom: 30px; 
            left: 0; width: 100%;
            display: flex; justify-content: center;
            z-index: 10;
        }
        .capture-btn {
            width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.2); border: 3px solid #fff;
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .capture-btn:active { background: #fff; transform: scale(0.9); }
        
        /* Notificação chique */
        .status-toast {
            position: absolute; top: 20px; background: rgba(4, 8, 20, 0.85);
            padding: 12px 25px; border-radius: 30px; border: 1px solid var(--prata);
            font-size: 0.85rem; display: none; z-index: 20; color: #fff; 
            font-weight: 500; backdrop-filter: blur(10px); letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* === TELA DA GALERIA === */
        #gallery-screen { padding: 30px 20px; justify-content: flex-start; }
        .gallery-header { margin-bottom: 25px; text-align: center; width: 100%; }
        .gallery-desc { font-size: 0.8rem; color: var(--prata-escuro); margin-top: 5px; }
        
        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            padding-bottom: 40px;
        }
        
        .foto-card {
            position: relative; width: 100%; aspect-ratio: 3/4;
            border-radius: 16px; overflow: hidden; background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .foto-card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Botões de Ação na Foto */
        .foto-actions {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; justify-content: space-around;
        }
        .btn-icon {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; backdrop-filter: blur(5px); text-decoration: none;
            font-size: 1.2rem; transition: background 0.3s ease;
        }
        .btn-icon:active { background: var(--rosa); color: var(--azul-escuro); border-color: var(--rosa);}

        .empty-state { text-align: center; color: var(--prata-escuro); margin-top: 50px; font-size: 0.9rem; grid-column: span 2;}

        /* === MENU INFERIOR === */
        .bottom-nav {
            height: 75px; 
            background: rgba(4, 8, 20, 0.95);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: none; justify-content: space-around; align-items: center;
            width: 100%; z-index: 100; backdrop-filter: blur(15px);
        }
        .nav-item {
            color: var(--prata-escuro); font-size: 0.75rem; text-transform: uppercase;
            font-weight: 600; cursor: pointer; padding: 12px 25px; border-radius: 30px;
            letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .nav-item.active { background: rgba(244, 172, 183, 0.1); color: var(--rosa); border: 1px solid rgba(244, 172, 183, 0.2);}
        
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1 class="login-title">Ana Julia</h1>
            <p class="login-subtitle">Câmera do Convidado</p>
            
            <div class="input-group">
                <input type="text" id="input-nome" class="lux-input" placeholder="Nome" autocomplete="off">
                <input type="text" id="input-sobrenome" class="lux-input" placeholder="Sobrenome" autocomplete="off">
            </div>
            
            <button class="btn-acao" onclick="entrarNoSistema()">Ligar Câmera</button>
        </div>
    </div>

    <!-- 2. TELA DA CÂMERA -->
    <div id="camera-screen" class="screen">
        <div id="status-toast" class="status-toast"></div>
        <video id="video-preview" autoplay playsinline></video>
        
        <div class="capture-wrapper">
            <button class="capture-btn" onclick="tirarFoto()"></button>
        </div>
        
        <canvas id="canvas-escondido" style="display: none;"></canvas>
    </div>

    <!-- 3. TELA DA GALERIA PESSOAL -->
    <div id="gallery-screen" class="screen">
        <div class="gallery-header">
            <h2 style="font-size: 2.8rem;">Suas Fotos</h2>
            <p class="gallery-desc">Salve ou compartilhe seus cliques da festa!</p>
        </div>
        <div class="grid-galeria" id="grid-fotos">
            <!-- As fotos aparecem aqui -->
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <div id="bottom-menu" class="bottom-nav">
        <div class="nav-item active" id="nav-camera" onclick="mudarAba('camera')">
            <span style="font-size: 1.1rem;">📷</span> Câmera
        </div>
        <div class="nav-item" id="nav-galeria" onclick="mudarAba('galeria')">
            <span style="font-size: 1.1rem;">🖼️</span> Galeria
        </div>
    </div>

    <script>
        // Variáveis Locais
        let nomeCompleto = "";
        let streamDeVideo = null;
        let minhasCapturas = []; // Array que guarda as fotos tiradas

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-escondido');
        const statusToast = document.getElementById('status-toast');
        
        // ==========================================
        // LÓGICA DE NAVEGAÇÃO
        // ==========================================
        function entrarNoSistema() {
            const nome = document.getElementById('input-nome').value.trim();
            const sobrenome = document.getElementById('input-sobrenome').value.trim();
            
            if(!nome) { alert("Por favor, informe pelo menos o seu nome!"); return; }
            
            nomeCompleto = `${nome} ${sobrenome}`.trim();
            
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('bottom-menu').style.display = 'flex';
            mudarAba('camera');
        }

        function mudarAba(aba) {
            document.getElementById('camera-screen').classList.remove('active');
            document.getElementById('gallery-screen').classList.remove('active');
            document.getElementById('nav-camera').classList.remove('active');
            document.getElementById('nav-galeria').classList.remove('active');

            if(aba === 'camera') {
                document.getElementById('camera-screen').classList.add('active');
                document.getElementById('nav-camera').classList.add('active');
                iniciarCamera();
            } else {
                document.getElementById('gallery-screen').classList.add('active');
                document.getElementById('nav-galeria').classList.add('active');
                pararCamera();
                renderizarGaleria();
            }
        }

        // ==========================================
        // CÂMERA E CAPTURA (SALVANDO LOCAL)
        // ==========================================
        async function iniciarCamera() {
            try {
                streamDeVideo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, 
                    audio: false
                });
                video.srcObject = streamDeVideo;
            } catch (err) {
                alert("Erro ao acessar a câmera. Tente usar o Safari ou Chrome e permita o acesso.");
            }
        }

        function pararCamera() {
            if(streamDeVideo) {
                streamDeVideo.getTracks().forEach(track => track.stop());
            }
        }

        function mostrarToast(msg) {
            statusToast.innerText = msg;
            statusToast.style.display = 'block';
            setTimeout(() => { statusToast.style.display = 'none'; }, 2500);
        }

        function tirarFoto() {
            // Efeito visual de "piscar" a tela
            video.style.opacity = '0.3';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            // Captura o quadro
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converte para Base64 (salva na memória do navegador temporariamente)
            const fotoDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            minhasCapturas.unshift(fotoDataUrl); // Adiciona no início da lista

            mostrarToast("FOTO SALVA NA GALERIA!");
        }

        // ==========================================
        // GALERIA (RENDERIZAR, BAIXAR E COMPARTILHAR)
        // ==========================================
        function renderizarGaleria() {
            const grid = document.getElementById('grid-fotos');
            grid.innerHTML = ''; 
            
            if (minhasCapturas.length === 0) {
                grid.innerHTML = '<div class="empty-state">Você ainda não tirou nenhuma foto. Volte para a câmera!</div>';
                return;
            }

            minhasCapturas.forEach((fotoBase64, index) => {
                const div = document.createElement('div');
                div.className = 'foto-card';
                
                // Nome do arquivo para download
                const nomeArquivo = `AnaJulia15_${nomeCompleto.replace(/\s+/g, '')}_${index}.jpg`;
                
                div.innerHTML = `
                    <img src="${fotoBase64}" alt="Minha Foto">
                    <div class="foto-actions">
                        <a href="${fotoBase64}" download="${nomeArquivo}" class="btn-icon" title="Baixar Foto">⬇️</a>
                        <div class="btn-icon" onclick="compartilharFoto('${fotoBase64}', '${nomeArquivo}')" title="Compartilhar">📤</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        // Função de Compartilhar Nativa do Celular (WhatsApp, Instagram, etc)
        async function compartilharFoto(dataUrl, nomeArquivo) {
            try {
                // Converte o Base64 de volta para um arquivo físico que o WhatsApp entenda
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                const file = new File([blob], nomeArquivo, { type: 'image/jpeg' });

                // Verifica se o celular suporta compartilhar arquivos
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: '15 Anos Ana Julia',
                        text: 'Olha o clique que eu fiz nos 15 anos da Ana Julia! ✨'
                    });
                } else {
                    alert("Seu navegador não suporta compartilhamento direto. Use o botão de baixar e envie pela sua galeria!");
                }
            } catch (error) {
                console.log('Compartilhamento cancelado ou falhou', error);
            }
        }
    </script>
</body>
</html>
